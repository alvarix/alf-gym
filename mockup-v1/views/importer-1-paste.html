<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>alf-gym - importer 1</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
  <main class="frame">
    <a href="../index.html" class="back-link">all views</a>
    <h2>Importer step 1: Paste / pick</h2>
    <p class="annotation" style="margin: 0 0 12px;">
      Paste raw text or pick a markdown file. Choose source format. Source format pre-tunes the parser.
    </p>

    <div class="phone">
      <div class="screen">
        <div class="topbar">
          <span class="muted">‹</span>
          <span class="title">Import &middot; step 1 / 4</span>
          <span class="muted">help</span>
        </div>

        <div class="section">
          <div class="section-head">source format</div>
          <div class="col tight">
            <label class="card" style="cursor: pointer; border-color: var(--text);">
              <div class="row spread">
                <div>
                  <div style="font-weight: 500;">Modern (Workout 9.x)</div>
                  <div class="muted" style="font-size: 12px;">Markdown checkboxes, italic exercise names, indented details</div>
                </div>
                <input type="radio" name="fmt" checked style="width:auto;height:auto;margin:0;" />
              </div>
            </label>
            <label class="card" style="cursor: pointer;">
              <div class="row spread">
                <div>
                  <div style="font-weight: 500;">Legacy PRX</div>
                  <div class="muted" style="font-size: 12px;">.10-3 syntax, parens for circuits, --//-- session separator</div>
                </div>
                <input type="radio" name="fmt" style="width:auto;height:auto;margin:0;" />
              </div>
            </label>
            <label class="card" style="cursor: pointer;">
              <div class="row spread">
                <div>
                  <div style="font-weight: 500;">Freeform</div>
                  <div class="muted" style="font-size: 12px;">Best-effort, expect lots of yellow lines for review</div>
                </div>
                <input type="radio" name="fmt" style="width:auto;height:auto;margin:0;" />
              </div>
            </label>
          </div>
        </div>

        <div class="section">
          <div class="section-head">paste source</div>
          <textarea rows="10" placeholder="paste markdown or text...">04/27/26
1015-1155
# Day A - Front
## 2. Anchor
- [x] *Smith machine BSS*
    50!:8,50:10,50:12
    - $2 L hip
- [x] *Zercher squat*
    70:8-3
</textarea>
          <div class="row tight" style="margin-top: 8px;">
            <button class="tiny">paste from clipboard</button>
            <button class="tiny">pick file...</button>
            <button class="tiny">drag in markdown</button>
          </div>
        </div>

        <div class="section">
          <div class="section-head">target</div>
          <div class="col tight">
            <div class="card">
              <div class="row spread">
                <div>
                  <div style="font-weight: 500;">Workout 9 / 9.2 / Day A / gym</div>
                  <div class="muted" style="font-size: 12px;">auto-detected from headers</div>
                </div>
                <button class="tiny">change</button>
              </div>
            </div>
          </div>
        </div>

        <div class="section">
          <button class="full primary">parse &rarr;</button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
